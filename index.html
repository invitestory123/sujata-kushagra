    <style>
      .music-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(12, 10, 36, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(226, 200, 143, 0.45);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(226, 200, 143, 0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        color: #e2c88f;
        outline: none;
      }
      .music-toggle-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 4px 25px rgba(226, 200, 143, 0.4);
        border-color: rgba(226, 200, 143, 0.8);
      }
      .music-toggle-btn:active {
        transform: scale(0.92);
      }
      .music-toggle-btn.playing svg {
        animation: music-spin 4s linear infinite;
      }
      .music-toggle-btn.paused {
        opacity: 0.75;
      }
      .music-toggle-btn.paused::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 24px;
        background: #e2c88f;
        transform: rotate(45deg);
        border-radius: 2px;
      }
      @keyframes music-spin {
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Floating Toggle -->
    <button id="musicToggle" type="button" aria-label="Toggle background music" class="music-toggle-btn paused">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>
    <audio id="weddingBgm" src="./editable/assets/bg-music.mp3" preload="auto" loop></audio>

    <script>
      (function() {
        var audio = document.getElementById('weddingBgm');
        var btn = document.getElementById('musicToggle');
        if (!audio || !btn) return;

        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.src) {
          audio.src = window.WEDDING_DATA.music.src;
        }

        var isPlaying = false;
        function updateUI(playing) {
          isPlaying = playing;
          if (playing) {
            btn.classList.add('playing');
            btn.classList.remove('paused');
            btn.setAttribute('aria-pressed', 'true');
          } else {
            btn.classList.remove('playing');
            btn.classList.add('paused');
            btn.setAttribute('aria-pressed', 'false');
          }
        }

        function tryPlay() {
          if (isPlaying) return;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              updateUI(true);
            }).catch(function(err) {
              updateUI(false);
            });
          }
        }

        // Auto-play attempt on page load
        tryPlay();

        // Autoplay unlock upon first user interaction anywhere (IntroGate click, scroll, touch)
        var unlockEvents = ['click', 'touchstart', 'scroll', 'keydown', 'pointerdown'];
        function onGesture() {
          tryPlay();
          unlockEvents.forEach(function(evt) {
            window.removeEventListener(evt, onGesture, true);
          });
        }
        unlockEvents.forEach(function(evt) {
          window.addEventListener(evt, onGesture, { capture: true, passive: true });
        });

        // Manual toggle button
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused) {
            audio.play().then(function() {
              updateUI(true);
            }).catch(function() {});
          } else {
            audio.pause();
            updateUI(false);
          }
        });
      })();
    </script>
  </body>
